name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Point Pages at this workflow's artifact. Without it the repository
      # keeps whatever source it had — and the default, "Deploy from a
      # branch", builds main with Jekyll, which turns README.md into the
      # index and serves that instead of the game. Both builds run, the
      # branch one lands second, and the deploy step here still reports
      # success while nobody can see its output.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # And then say it again, plainly. configure-pages reports success on a
      # repository whose source is already set to a branch without changing
      # it — enablement only covers the case where there is no Pages site at
      # all. The observable result was two deployments per push, the branch
      # build landing second, and README.md at the URL.
      #
      # Idempotent: once the build type is `workflow` this is a no-op, and it
      # is left in rather than run once by hand so that a fork, a rename or a
      # repository restored from a backup lands on its feet.
      - name: Serve Pages from this workflow, not from the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Don't ship a build that fails its own checks. The tests are worth
      # having in front of the deploy rather than beside it: a generator that
      # deals an unsolvable board is not something a player can work around.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
